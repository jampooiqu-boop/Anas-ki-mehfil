<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anas Ki Mehfil - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070a;color:#fff;font-family:Poppins,'Noto Nastaliq Urdu';padding-bottom:90px}
.top{padding:20px;background:radial-gradient(600px at 50% -20%,#2a2310,#07070a 70%);text-align:center}
.logo{font-family:'Noto Nastaliq Urdu';font-size:46px;color:#e8c45a}
.sub{color:#c8b07a;font-size:12px;letter-spacing:2px;margin-top:4px}
.greet{display:flex;justify-content:space-between;padding:16px}
.greet h3{color:#e8c45a;font-family:'Noto Nastaliq Urdu';font-size:26px}
.card{margin:0 16px;background:linear-gradient(135deg,#d8b86a,#b8943f,#f3d88a,#b8943f,#8c6a20);border-radius:26px;padding:20px;color:#1a1205}
.sher{text-align:center;font-family:'Noto Nastaliq Urdu';font-size:24px;line-height:1.9;font-weight:700}
.author{text-align:center;margin-top:10px;font-family:'Noto Nastaliq Urdu'}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px}
.tool{background:#151515;border:1.5px solid #c9a84c;border-radius:20px;padding:18px;text-align:center;cursor:pointer}
.tool b{color:#e8c45a;display:block;margin-top:8px}
.tool.active{box-shadow:0 0 20px rgba(232,196,90,.4)}
.workspace{margin:14px;background:#131313;border-radius:20px;padding:14px;border:1px solid #252525;display:none}
.workspace.show{display:block}
textarea{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;font-family:'Noto Nastaliq Urdu';font-size:20px;min-height:100px}
canvas{width:100%;border-radius:16px;margin:10px 0;background:#000}
.btn{width:100%;padding:14px;background:#e8c45a;color:#000;border:none;border-radius:12px;font-weight:800}
.chip{min-width:70px;height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;cursor:pointer;margin-right:6px}
.chip.active{border-color:#e8c45a}
.row{display:flex;overflow-x:auto;padding:8px 0}
.list{max-height:300px;overflow:auto}
.item{padding:10px;background:#0e0e0e;border-radius:10px;margin-bottom:6px;border:1px solid #222;font-family:'Noto Nastaliq Urdu'}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c0c0c;border-top:1px solid #222;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:8px 0 16px}
.bitem{text-align:center;color:#666}.bitem.active{color:#e8c45a}
</style>
</head>
<body>
<div class="top"><div class="logo">محفل سخن</div><div class="sub">ANAS KI MEHFIL • PREMIUM</div></div>
<div class="greet"><div><h3>السلام، علی</h3><p>آج کے لیے نیا کلام</p></div><div style="width:48px;height:48px;border-radius:50%;border:2px solid #e8c45a;display:flex;align-items:center;justify-content:center">👤</div></div>
<div class="card"><div class="sher" id="mainSher">دل کے اندھیروں میں بھی جلتا ہے چراغ آرزو<br>ہر شکست کے بعد ہوتا ہے سفر پھر نو</div><div class="author">— جاوید اقبال —</div></div>
<div class="tools">
<div class="tool active" onclick="openTool('photo')" id="tPhoto"><div style="font-size:32px">📷</div><b>Photo</b></div>
<div class="tool" onclick="openTool('video')" id="tVideo"><div style="font-size:32px">▶️</div><b>Video</b></div>
<div class="tool" onclick="openTool('voice')" id="tVoice"><div style="font-size:32px">🎙️</div><b>Voice</b></div>
</div>
<div id="wPhoto" class="workspace show">
<textarea id="pText">دل کے اندھیروں میں بھی جلتا ہے چراغ آرزو
ہر شکست کے بعد ہوتا ہے سفر پھر نو</textarea>
<div class="row" id="pColors"></div>
<canvas id="pCanvas" width="1080" height="1080"></canvas>
<button class="btn" onclick="downloadPhoto()">📥 HD Photo Save</button>
</div>
<div id="wVideo" class="workspace">
<textarea id="vText">دل کے اندھیروں میں بھی جلتا ہے چراغ آرزو
ہر شکست کے بعد ہوتا ہے سفر پھر نو</textarea>
<div class="row">
<div class="chip active" style="background:linear-gradient(135deg,#0f0c29,#302b63)" onclick="setV(0,this)">Barish</div>
<div class="chip" style="background:linear-gradient(135deg,#000,#434343)" onclick="setV(1,this)">Raat</div>
<div class="chip" style="background:linear-gradient(135deg,#ff7e5f,#feb47b)" onclick="setV(2,this)">Chai</div>
<div class="chip" style="background:linear-gradient(135deg,#2193b0,#6dd5ed)" onclick="setV(3,this)">Samandar</div>
</div>
<canvas id="vCanvas" width="720" height="1280"></canvas>
<button class="btn" onclick="previewV()">▶️ Preview</button>
<button class="btn" style="margin-top:8px;background:#222;color:#fff;border:1px solid #333" onclick="recordV()">🎬 5 Sec Video Download</button>
</div>
<div id="wVoice" class="workspace">
<div class="row">
<div class="chip active" style="background:#1e1e1e;width:auto;padding:0 14px" onclick="filterPoet('all',this)">All</div>
<div class="chip" style="background:#1e1e1e;width:auto;padding:0 14px" onclick="filterPoet('Ghalib',this)">Ghalib</div>
<div class="chip" style="background:#1e1e1e;width:auto;padding:0 14px" onclick="filterPoet('Faiz',this)">Faiz</div>
<div class="chip" style="background:#1e1e1e;width:auto;padding:0 14px" onclick="filterPoet('Jaun',this)">Jaun</div>
<div class="chip" style="background:#1e1e1e;width:auto;padding:0 14px" onclick="filterPoet('Iqbal',this)">Iqbal</div>
</div>
<div class="list" id="voiceList"></div>
<p id="nowP" style="text-align:center;padding:12px;font-family:'Noto Nastaliq Urdu';font-size:20px">Koi sher chunno...</p>
<button class="btn" onclick="speak()">🔊 Suno</button>
</div>

const grads=[['#0f0c29','#302b63'],['#141e30','#243b55'],['#200122','#6f0000'],['#3e2723','#795548'],['#004d40','#00796b']];
let curG=0,curV=0,anim; const pC=document.getElementById('pCanvas'),pX=pC.getContext('2d'); const vC=document.getElementById('vCanvas'),vX=vC.getContext('2d');
