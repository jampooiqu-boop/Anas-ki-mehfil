<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anas Ki Mehfil</title><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08070a;color:#fff;font-family:sans-serif}.h{text-align:center;padding:24px;border-bottom:1px solid #d4af3720}.h h1{font-family:'Noto Nastaliq Urdu';font-size:40px;color:#d4af37}.c{max-width:800px;margin:auto;padding:16px}.card{background:linear-gradient(135deg,#d4af37,#f6e27a);color:#000;border-radius:16px;padding:20px;text-align:center;margin:16px 0;font-family:'Noto Nastaliq Urdu';font-size:22px;line-height:2}.t{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.tb{background:#15131a;border:1.5px solid #d4af3740;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.tb.active{border-color:#d4af37;background:#1e1b12}.box{background:#111015;border:1px solid #d4af3720;border-radius:14px;padding:14px;margin-top:12px;min-height:200px}.p{display:none}.p.active{display:block}.it{background:#1a191f;padding:10px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between}</style></head><body><div class="h"><h1>محفل سخن</h1><p style="font-size:10px;letter-spacing:4px;color:#8a7a4a">ANAS KI MEHFIL - PREMIUM</p></div><div class="c"><div class="card">دل کے تہہ خانوں میں بھی حشر برپا ہے ہر اک آرزو<br>ہر شکست کے بعد ہوتا ہے سفر نکھرا ہوا</div><div class="t"><div class="tb active" onclick="op('a',this)">🎙️<br><b>Voice</b></div><div class="tb" onclick="op('b',this)">🎬<br><b>Video</b></div><div class="tb" onclick="op('c',this)">📸<br><b>Photo</b></div></div><div class="box"><div id="a" class="p active"><div class="it"><span>دل کی باتیں</span><button>Play</button></div><div class="it"><span>شام کا افسانہ</span><button>Play</button></div></div><div id="b" class="p">Video section jald</div><div id="c" class="p">Photo section jald</div></div></div><script>function op(id,e){document.querySelectorAll('.p').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));e.classList.add('active')}</script></body></html>
