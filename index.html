<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anas Ki Mehfil</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:'Noto Nastaliq Urdu',serif}
.top{text-align:center;padding:26px 16px;background:radial-gradient(ellipse at top,#1d1808,#070707)}
.top h1{font-size:42px;color:#d4af37;text-shadow:0 0 20px #d4af3755}
.top p{font-family:sans-serif;font-size:10px;letter-spacing:4px;color:#8a7a4a;margin-top:4px}

/* AADHA AUR KHUBSURAT BOX */
.mid{margin:12px auto;width:88%;max-width:340px;background:linear-gradient(135deg,#16130a,#1f1b0f);border-radius:50px 14px 50px 14px;border:1.5px solid #d4af37;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(212,175,55,0.2)}
.profile{width:44px;height:44px;min-width:44px;border-radius:50%;border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;background:#000;font-size:20px;box-shadow:0 0 10px #d4af3755}
.greet{flex:1;min-width:0}
.salam{font-size:18px;color:#f3d36a;line-height:1.3;white-space:normal}
.sub{font-size:13px;color:#a99a6a;margin-top:2px;font-family:sans-serif;letter-spacing:0.5px}

.sher{margin:12px 16px;background:linear-gradient(135deg,#d4af37,#f6e27a);color:#000;border-radius:16px;padding:14px;text-align:center;box-shadow:0 6px 18px rgba(212,175,55,0.3)}
.sher div{font-size:18px;line-height:1.8;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 16px}
.tab{background:#111;border:1px solid #d4af37;border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.tab.active{background:#d4af37;color:#000;box-shadow:0 0 14px #d4af3766}
.tab .lbl{font-family:sans-serif;font-weight:700;display:block;font-size:13px;margin-top:3px}
.content{margin:0 16px 20px;background:#101010;border-radius:14px;padding:10px;min-height:200px;border:1px solid #1e1e1e}
.panel{display:none}.panel.active{display:block}
.card{background:#181818;padding:10px;border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.play{background:#d4af37;border:none;border-radius:18px;padding:5px 12px;font-weight:700;font-size:12px}
.vbox{background:#000;border:1px solid #2a2a2a;height:120px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:7px 0;font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ph{height:90px;background:#1c1c1c;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px}
</style>
</head>
<body>
<div class="top"><h1>محفل سخن</h1><p>ANAS KI MEHFIL</p></div>

<div class="mid">
<div class="profile">👤</div>
<div class="greet">
<div class="salam">السلام علیکم انس بھائی!</div>
<div class="sub">نئی غزلیں موجود ہیں</div>
</div>
</div>

<div class="sher"><div>دل کے اندھیروں میں بھی جلتا ہے چراغ آرزو</div></div>

<div class="tabs">
<div class="tab active" onclick="openTab('voice',this)">🎙️<span class="lbl">Voice</span></div>
<div class="tab" onclick="openTab('video',this)">▶️<span class="lbl">Video</span></div>
<div class="tab" onclick="openTab('photo',this)">📷<span class="lbl">Photo</span></div>
</div>

<div class="content">
<div id="voice" class="panel active"><div class="card"><span>دل کی باتیں</span><button class="play">Play</button></div><div class="card"><span>شام کا افسانہ</span><button class="play">Play</button></div></div>
<div id="video" class="panel"><div class="vbox">🎬 Video</div></div>
<div id="photo" class="panel"><div class="pgrid"><div class="ph">📷 1</div><div class="ph">📷 2</div><div class="ph">📷 3</div><div class="ph">📷 4</div></div></div>
</div>

<script>
function openTab(id, el){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
}
</script>
</body>
</html>
