<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anas Ki Mehfil</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:'Noto Nastaliq Urdu',serif;text-align:center}
.top{padding:20px;background:#111}.top h1{font-size:36px;color:#d4af37}
.mid{margin:15px auto;width:200px;background:#1a1a1a;border:1.5px solid #d4af37;border-radius:50px;padding:10px;display:flex;align-items:center;gap:10px;justify-content:center}
.mid img{width:40px;height:40px;border-radius:50%;border:2px solid #d4af37}
.mid div{color:#f3d36a;font-size:18px;font-weight:700}
.tabs{display:flex;gap:10px;padding:15px;justify-content:center}
.tab{background:#222;border:1px solid #d4af37;padding:12px 20px;border-radius:10px;cursor:pointer;color:#fff}
.tab.active{background:#d4af37;color:#000;font-weight:700}
.content{margin:0 15px;background:#121212;border-radius:12px;padding:15px;min-height:200px;text-align:left}
.panel{display:none}.panel.active{display:block;color:#ccc}
.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px}
</style>
</head>
<body>
<div class="top"><h1>محفل سخن</h1><p>ANAS KI MEHFIL</p></div>

<div class="mid">
<img src="anas.jpg" alt="Anas">
<div>السلام علیکم!</div>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('voice',this)">🎙️ Voice</div>
<div class="tab" onclick="showTab('video',this)">▶️ Video</div>
<div class="tab" onclick="showTab('photo',this)">📷 Photo</div>
</div>

<div class="content">
<div id="voice" class="panel active">
<div class="card">🎙️ دل کی باتیں - Audio 1</div>
<div class="card">🎙️ شام کا افسانہ - Audio 2</div>
<audio controls style="width:100%;margin-top:10px"><source src="" type="audio/mpeg">Audio yahan chalega</audio>
</div>
<div id="video" class="panel">
<div class="card">▶️ Video 1 - Yahan video aayegi</div>
<div class="card">▶️ Mehfil Video - Yahan video aayegi</div>
</div>
<div id="photo" class="panel">
<div class="card">📷 Photo 1</div>
<div class="card">📷 Photo 2</div>
<div class="card">📷 Photo 3</div>
</div>
</div>

<script>
function showTab(id, el){
 var panels=document.querySelectorAll('.panel');
 for(var i=0;i<panels.length;i++){panels[i].classList.remove('active');}
 document.getElementById(id).classList.add('active');
 var tabs=document.querySelectorAll('.tab');
 for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');}
 el.classList.add('active');
}
</script>
</body>
</html>
